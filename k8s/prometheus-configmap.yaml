apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-server-conf
  namespace: lab8
  labels:
    name: prometheus-server-conf
    app.kubernetes.io/part-of: campusconnect
data:
  prometheus.yml: |-
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    scrape_configs:
      - job_name: "gateway"
        metrics_path: /metrics
        static_configs:
          - targets: ["gateway-service:3000"]

      - job_name: "kubernetes-pods"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - lab8
