apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-db
  namespace: lab8
  labels:
    app: user-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-db
  template:
    metadata:
      labels:
        app: user-db
    spec:
      containers:
        - name: mongo
          image: mongo:6
          ports:
            - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: user-db
  namespace: lab8
spec:
  type: ClusterIP
  selector:
    app: user-db
  ports:
    - port: 27017
      targetPort: 27017
