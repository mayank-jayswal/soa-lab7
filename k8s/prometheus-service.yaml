apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: lab8
  labels:
    app: prometheus-server
    app.kubernetes.io/part-of: campusconnect
spec:
  type: NodePort
  selector:
    app: prometheus-server
  ports:
    - name: web
      port: 9090
      targetPort: 9090
      nodePort: 30090
