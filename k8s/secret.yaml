apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: lab8
  labels:
    app.kubernetes.io/part-of: campusconnect
type: Opaque
stringData:
  # Sensitive MongoDB Atlas Connection Strings
  MONGO_URI: "mongodb://user-db:27017/campusconnect_db"
  USER_MONGO_URI: "mongodb://user-db:27017/user_service_db"
  PRODUCT_MONGO_URI: "mongodb://product-db:27017/product_service_db"
  ORDER_MONGO_URI: "mongodb://order-db:27017/order_service_db"
