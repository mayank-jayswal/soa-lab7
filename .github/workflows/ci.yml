name: Lab 8 CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: api-gateway
            dir: ./api-gateway
          - name: user-service
            dir: ./user-service
          - name: product-service
            dir: ./product-service
          - name: order-service
            dir: ./order-service

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "${{ matrix.service.dir }}/package-lock.json"
        continue-on-error: true

      - name: 📦 Install Dependencies
        run: |
          cd ${{ matrix.service.dir }}
          npm install

      - name: 🧪 Run Automated Tests
        run: |
          cd ${{ matrix.service.dir }}
          npm test

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏷️ Determine Image Tags
        id: meta
        run: |
          IMAGE_NAME="campusconnect-${{ matrix.service.name }}"
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "SHA_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: 🔨 Build Docker Image (Versioned with SHA)
        run: |
          cd ${{ matrix.service.dir }}
          docker build \
            --tag $IMAGE_NAME:${{ github.sha }} \
            --tag $IMAGE_NAME:latest \
            .

      - name: 📋 Verify Docker Image
        run: |
          docker images | grep "$IMAGE_NAME"

      # Optional Publish step to GitHub Container Registry (GHCR) when pushed to main
      - name: 🔑 Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.actor != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: 🚀 Push Versioned Image to GHCR
        if: github.event_name != 'pull_request' && github.actor != ''
        run: |
          GHCR_TAG="ghcr.io/${{ github.repository_owner }}/campusconnect-${{ matrix.service.name }}"
          docker tag $IMAGE_NAME:${{ github.sha }} $GHCR_TAG:${{ github.sha }}
          docker tag $IMAGE_NAME:latest $GHCR_TAG:latest
          docker push $GHCR_TAG:${{ github.sha }} || echo "Skipping push: Check GHCR permissions"
          docker push $GHCR_TAG:latest || echo "Skipping push: Check GHCR permissions"
        continue-on-error: true
