services:
  # =========================================================================
  # API GATEWAY — Single Public Entry Point (Lab 7)
  # =========================================================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"        # ← ONLY port exposed externally
    environment:
      PORT: 3000
      # Service Registry — config-based service discovery
      USER_SERVICE_URL: http://user-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
    depends_on:
      - user-service
      - product-service
      - order-service
    networks:
      - campus-network

  # =========================================================================
  # 1. USER MICROSERVICE & DATABASE (from Lab 6 — unchanged)
  # =========================================================================
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    restart: unless-stopped
    # NO external ports — only reachable from inside Docker network
    expose:
      - "3001"
    environment:
      PORT: 3001
      MONGO_URI: mongodb://user-db:27017/user_service_db
    depends_on:
      - user-db
    networks:
      - campus-network

  user-db:
    image: mongo:6
    container_name: user-db
    restart: unless-stopped
    volumes:
      - user-db-data:/data/db
    networks:
      - campus-network

  # =========================================================================
  # 2. PRODUCT MICROSERVICE & DATABASE (from Lab 6 — unchanged)
  # =========================================================================
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-service
    restart: unless-stopped
    # NO external ports — only reachable from inside Docker network
    expose:
      - "3002"
    environment:
      PORT: 3002
      MONGO_URI: mongodb://product-db:27017/product_service_db
    depends_on:
      - product-db
    networks:
      - campus-network

  product-db:
    image: mongo:6
    container_name: product-db
    restart: unless-stopped
    volumes:
      - product-db-data:/data/db
    networks:
      - campus-network

  # =========================================================================
  # 3. ORDER MICROSERVICE & DATABASE (from Lab 6 — unchanged)
  # =========================================================================
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    restart: unless-stopped
    # NO external ports — only reachable from inside Docker network
    expose:
      - "3003"
    environment:
      PORT: 3003
      MONGO_URI: mongodb://order-db:27017/order_service_db
      USER_SERVICE_URL: http://user-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
    depends_on:
      - order-db
      - user-service
      - product-service
    networks:
      - campus-network

  order-db:
    image: mongo:6
    container_name: order-db
    restart: unless-stopped
    volumes:
      - order-db-data:/data/db
    networks:
      - campus-network

# =========================================================================
# NETWORKS & PERSISTENCE VOLUMES
# =========================================================================
networks:
  campus-network:
    name: campus-network
    driver: bridge

volumes:
  user-db-data:
    name: user-db-data
  product-db-data:
    name: product-db-data
  order-db-data:
    name: order-db-data
